<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="340" viewBox="0 0 1100 340" role="img" aria-labelledby="title desc">
  <title id="title">IMDb model F1 comparison</title><desc id="desc">In the full training-data setting, Naive Bayes F1 is 0.846688, Logistic Regression F1 is 0.883284, and DistilBERT F1 is 0.914496.</desc><rect x="1" y="1" width="1098" height="338" rx="18" fill="#f7fafb" stroke="#c8d6dc"/><g font-family="system-ui,-apple-system,'Segoe UI',Arial,sans-serif"><text x="48" y="48" fill="#17313b" font-size="24" font-weight="720">Full training-data F1</text><text x="48" y="74" fill="#5a6e77" font-size="14">Archived IMDb test-set results · bars use a zero baseline</text><g fill="#e3e9ec"><rect x="255" y="105" width="760" height="38" rx="8"/><rect x="255" y="172" width="760" height="38" rx="8"/><rect x="255" y="239" width="760" height="38" rx="8"/></g><rect x="255" y="105" width="643" height="38" rx="8" fill="#708391"/><rect x="255" y="172" width="671" height="38" rx="8" fill="#3e8d9a"/><rect x="255" y="239" width="695" height="38" rx="8" fill="#6657b8"/><g fill="#17313b" font-size="16" font-weight="700"><text x="48" y="130">Naive Bayes</text><text x="48" y="197">Logistic Regression</text><text x="48" y="264">DistilBERT</text></g><g fill="#17313b" font-size="16" font-weight="750" text-anchor="end"><text x="1036" y="130">0.846688</text><text x="1036" y="197">0.883284</text><text x="1036" y="264">0.914496</text></g><text x="1015" y="310" text-anchor="end" fill="#5a6e77" font-size="13">Timing is hardware-dependent and is not encoded in this chart.</text></g>
